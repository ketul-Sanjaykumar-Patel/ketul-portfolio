<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="32" fill="#0F172A"/>
  <rect x="32" y="32" width="1136" height="656" rx="24" fill="#111827" stroke="#334155"/>
  <text x="70" y="96" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Robot Autopilot Stack</text>
  <text x="70" y="130" fill="#94A3B8" font-family="Arial, sans-serif" font-size="20">Hailo direction inference + EDGEVISION geometry + UART control on Raspberry Pi 5</text>

  <rect x="70" y="190" width="220" height="112" rx="18" fill="#1E293B" stroke="#3B82F6"/>
  <text x="100" y="236" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">Pi Camera / USB</text>
  <text x="100" y="270" fill="#93C5FD" font-family="Arial, sans-serif" font-size="18">1280 x 720 live feed</text>

  <rect x="360" y="170" width="250" height="152" rx="18" fill="#132238" stroke="#2563EB"/>
  <text x="392" y="216" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">Hailo HEF Inference</text>
  <text x="392" y="252" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="18">224 x 224 MobileNetV2</text>
  <text x="392" y="282" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="18">4 classes: F / L / R / S</text>

  <rect x="360" y="368" width="250" height="162" rx="18" fill="#142B2A" stroke="#14B8A6"/>
  <text x="392" y="414" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">EDGEVISION</text>
  <text x="392" y="450" fill="#99F6E4" font-family="Arial, sans-serif" font-size="18">CLAHE + Canny + Hough</text>
  <text x="392" y="480" fill="#99F6E4" font-family="Arial, sans-serif" font-size="18">Contour obstacles + centering</text>

  <rect x="690" y="245" width="240" height="190" rx="18" fill="#1E293B" stroke="#A78BFA"/>
  <text x="722" y="291" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">Decision Fusion</text>
  <text x="722" y="327" fill="#DDD6FE" font-family="Arial, sans-serif" font-size="18">confidence gate = 0.70</text>
  <text x="722" y="357" fill="#DDD6FE" font-family="Arial, sans-serif" font-size="18">centre correction override</text>
  <text x="722" y="387" fill="#DDD6FE" font-family="Arial, sans-serif" font-size="18">obstacle stop fallback</text>

  <rect x="990" y="245" width="130" height="190" rx="18" fill="#2A1A1A" stroke="#F97316"/>
  <text x="1016" y="294" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="700">UART</text>
  <text x="1016" y="328" fill="#FED7AA" font-family="Arial, sans-serif" font-size="17">0.15 s</text>
  <text x="1016" y="355" fill="#FED7AA" font-family="Arial, sans-serif" font-size="17">command</text>
  <text x="1016" y="382" fill="#FED7AA" font-family="Arial, sans-serif" font-size="17">interval</text>

  <rect x="905" y="520" width="215" height="110" rx="18" fill="#1F2937" stroke="#22C55E"/>
  <text x="938" y="566" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">Tiva MCU + Motors</text>
  <text x="938" y="598" fill="#BBF7D0" font-family="Arial, sans-serif" font-size="18">Forward / left / right / stop</text>

  <rect x="70" y="560" width="730" height="78" rx="18" fill="#172554" stroke="#60A5FA"/>
  <text x="102" y="607" fill="#E0F2FE" font-family="Arial, sans-serif" font-size="22">Result: classifier output is no longer trusted alone - geometry and safety rules can correct drift or force stop.</text>

