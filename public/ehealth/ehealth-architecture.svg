  <text x="92" y="120" fill="#113355" font-family="Arial, sans-serif" font-size="36" font-weight="700">
    e-Health IoT Platform
  </text>
  <text x="92" y="156" fill="#5A6D85" font-family="Arial, sans-serif" font-size="18">
    Two Arduino R4 WiFi nodes send sensor data to a Raspberry Pi 5 gateway for storage, alerts, and a live dashboard.
  </text>

