  <rect x="122" y="326" width="260" height="34" rx="17" fill="#D9E9FF"/>
  <text x="138" y="348" fill="#21486F" font-family="Arial, sans-serif" font-size="16">BMP280 | MAX30105 | MPU6050</text>
