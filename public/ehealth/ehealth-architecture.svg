  <text x="138" y="396" fill="#21486F" font-family="Arial, sans-serif" font-size="16">Alcohol sensor | LCD | I2C bus</text>
  <text x="122" y="438" fill="#48637C" font-family="Arial, sans-serif" font-size="16">JSON over HTTP every 2 seconds</text>

