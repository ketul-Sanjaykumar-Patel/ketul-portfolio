<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="680" rx="32" fill="#0F172A"/>
  <rect x="32" y="32" width="1136" height="616" rx="24" fill="#111827" stroke="#334155"/>
  <text x="70" y="96" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Hailo Deployment Pipeline</text>
  <text x="70" y="130" fill="#94A3B8" font-family="Arial, sans-serif" font-size="20">Dataset -> train.py -> ONNX opset 11 -> calibration -> compile_hailo.py -> HEF on Raspberry Pi 5</text>

  <rect x="70" y="220" width="160" height="120" rx="18" fill="#1E293B" stroke="#64748B"/>
  <text x="105" y="270" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">Dataset</text>
  <text x="93" y="303" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18">F / L / R / S</text>

  <rect x="280" y="200" width="220" height="160" rx="18" fill="#132238" stroke="#2563EB"/>
  <text x="320" y="248" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">train.py</text>
  <text x="320" y="284" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="18">MobileNetV2 backbone</text>
  <text x="320" y="314" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="18">224 x 224 input</text>
  <text x="320" y="344" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="18">ONNX opset 11</text>

  <rect x="560" y="188" width="236" height="184" rx="18" fill="#142B2A" stroke="#14B8A6"/>
  <text x="598" y="236" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">Export Artifacts</text>
  <text x="598" y="272" fill="#99F6E4" font-family="Arial, sans-serif" font-size="18">robot_drive.onnx</text>
  <text x="598" y="302" fill="#99F6E4" font-family="Arial, sans-serif" font-size="18">calibration_images.npy</text>
  <text x="598" y="332" fill="#99F6E4" font-family="Arial, sans-serif" font-size="18">class_indices.txt</text>

  <rect x="856" y="176" width="264" height="208" rx="18" fill="#261B39" stroke="#A78BFA"/>
  <text x="892" y="224" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">compile_hailo.py</text>
  <text x="892" y="260" fill="#E9D5FF" font-family="Arial, sans-serif" font-size="18">translate_onnx_model()</text>
  <text x="892" y="290" fill="#E9D5FF" font-family="Arial, sans-serif" font-size="18">optimize(calib_images)</text>
  <text x="892" y="320" fill="#E9D5FF" font-family="Arial, sans-serif" font-size="18">compile() -> HEF</text>
  <text x="892" y="350" fill="#E9D5FF" font-family="Arial, sans-serif" font-size="18">hailo8l / hailo8 targets</text>

  <rect x="390" y="460" width="430" height="120" rx="18" fill="#172554" stroke="#60A5FA"/>
  <text x="426" y="510" fill="#E0F2FE" font-family="Arial, sans-serif" font-size="24" font-weight="700">Deployment Constraints Solved</text>
  <text x="426" y="545" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="18">Input shape divisibility, node naming, supported ops, calibration quality, and hardware profile selection.</text>

  <rect x="900" y="462" width="220" height="118" rx="18" fill="#1F2937" stroke="#22C55E"/>
  <text x="936" y="512" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">HEF on Pi 5</text>
  <text x="936" y="544" fill="#BBF7D0" font-family="Arial, sans-serif" font-size="18">Run with HailoRT</text>

  <path d="M230 280H260" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M500 280H540" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M796 280H836" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
